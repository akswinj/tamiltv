<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tamil TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8a33d'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23141a22'/%3E%3C/svg%3E">
<style>
:root{--bg:#121214;--s1:#1c1c1f;--s2:#2c2c2f;--line:#3a3a3e;--tx:#f5f5f7;--mu:#8e8e93;--red:#e0302a;--ac:#f5b942;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:1rem/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;height:100vh;height:100dvh;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus{outline:3px solid var(--tx);outline-offset:-3px}
.app{display:flex;height:100%}
.side{width:32rem;flex:none}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid #222226}
.top{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 1.3rem .9rem;padding:calc(1.2rem + env(safe-area-inset-top)) 1.3rem .9rem}
.top h2{font-size:2.1rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
#lang{background:var(--s2);border:1px solid var(--line);border-radius:2rem;padding:.45rem .8rem}
#chips{display:flex;overflow-x:auto;padding:0 1.3rem .9rem;scrollbar-width:none;flex:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:2.6rem;padding:0 1.2rem;border-radius:2rem;background:var(--s2);border:1px solid var(--line);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.search{position:relative;margin:0 1.3rem 1.1rem;flex:none}
.search svg{position:absolute;left:1.1rem;top:50%;transform:translateY(-50%);color:var(--mu)}
#q{width:100%;height:3.2rem;background:var(--s2);border:1px solid var(--line);border-radius:2rem;padding:0 1rem 0 3.1rem;font-size:1.05rem;-webkit-appearance:none;appearance:none}
#q::placeholder{color:var(--mu)}
.listwrap{position:relative;flex:1;min-height:0}
#grid{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;overscroll-behavior:contain;padding:0 2.4rem 2rem .8rem;scrollbar-width:none}
#grid::-webkit-scrollbar{display:none}
.row{display:flex;width:100%;text-align:left;margin-bottom:1.1rem;border-radius:.9rem}
.thumb{flex:0 0 42%;max-width:12rem;position:relative;border-radius:.8rem;background:hsl(var(--h),28%,24%);overflow:hidden}
.plate{position:absolute;top:11%;bottom:11%;left:14%;right:14%;display:flex;align-items:center;justify-content:center;border-radius:.55rem;background:#fff;color:#444;font-weight:700;overflow:hidden}
.plate img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain;padding:.4rem;background:#fff}
.blogo{flex:none;position:relative;width:3.6rem;height:2.7rem;border-radius:.55rem;background:#fff;overflow:hidden}
.blogo[hidden]{display:none}
.blogo img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:contain;padding:.3rem}
.meta{display:flex;flex-direction:column;min-width:0;padding-top:.7rem}
.num{color:var(--mu);font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{font-size:1.15rem;font-weight:650;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q{color:var(--mu);font-size:.95rem}
.row[aria-current=true] .num:before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:var(--red);margin-right:.45rem;vertical-align:.1em}
.row[aria-current=true] .thumb{box-shadow:0 0 0 2px var(--tx)}
.row.fav .name:after{content:" ★";color:var(--ac);font-size:.8em}
.empty{color:var(--mu);padding:1rem .5rem}
#scrub{position:absolute;right:.25rem;top:.2rem;bottom:1rem;width:2.1rem;display:flex;flex-direction:column;align-items:center;justify-content:space-between;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
#scrub[hidden]{display:none}
#scrub small{color:var(--mu);font-size:.72rem}
#scrub i{flex:none;width:.5rem;height:.5rem;border-radius:50%;background:#4b4b51}
#scrub i.on{width:1rem;height:1rem;background:var(--red)}
.dock{display:none;position:fixed;z-index:10;left:1rem;right:1rem;bottom:.8rem;bottom:calc(.8rem + env(safe-area-inset-bottom));align-items:center}
.tabs,.srch{background:rgba(44,44,47,.78);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08)}
.tabs{flex:1;display:flex;padding:.4rem;border-radius:2.4rem}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;padding:.55rem 0 .45rem;border-radius:2rem;font-size:.8rem;color:#d8d8dc}
.tabs button[aria-pressed=true]{background:rgba(0,0,0,.4);color:#fff;font-weight:600}
.tabs svg,.srch svg{width:1.5rem;height:1.5rem}
.srch{flex:none;width:3.9rem;height:3.9rem;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pane{display:flex;flex-direction:column;justify-content:center;flex:1 1 0%;min-width:0;padding:1.5rem 2rem;background:#0c0c0e}
#stage{position:relative;width:100%;max-width:calc((100vh - 9rem)*1.7778);margin:0 auto;background:#000;border-radius:.75rem;overflow:hidden}
#stage:fullscreen{max-width:none;width:100%;height:100%;border-radius:0}
#stage:fullscreen:before{display:none}
#stage:-webkit-full-screen{max-width:none;width:100%;height:100%;border-radius:0}
#stage:-webkit-full-screen:before{display:none}
video{position:absolute;top:0;left:0;width:100%;height:100%;display:block;object-fit:contain;background:#000}
#ov{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.5rem;background:rgba(10,10,12,.72);pointer-events:none}
#stage:not([data-s=ok]) #ov{display:flex}
#ov button,#ov p{display:none}
[data-s=error] #ov button,[data-s=error] #ov p,[data-s=idle] #ov p{display:block}
#ov button{pointer-events:auto;background:var(--tx);color:var(--bg);font-weight:600;border-radius:2rem;padding:.65rem 1.3rem}
#ov p{max-width:28rem}
.spin{width:2.2rem;height:2.2rem;border:3px solid var(--s2);border-top-color:var(--tx);border-radius:50%;animation:r .8s linear infinite;display:none}
[data-s=loading] .spin{display:block}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.bar{display:flex;align-items:center;width:100%;max-width:calc((100vh - 9rem)*1.7778);margin:0 auto;padding:1rem .1rem 0}
.info{flex:1;min-width:0}
.info h1{font-size:1.25rem;font-weight:650;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{color:var(--mu)}
.act{display:flex;align-items:center}
.ib{width:2.8rem;height:2.8rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--s2);border:1px solid var(--line)}
.ib:hover{background:var(--line)}
svg{width:1.3rem;height:1.3rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#fav[aria-pressed=true] svg{fill:var(--ac);stroke:var(--ac)}
#quality{background:var(--s2);border:1px solid var(--line);border-radius:2rem;height:2.8rem;padding:0 .8rem}
#back{display:none}
.thumb:before{content:"";display:block;padding-top:56.25%}
#stage:before{content:"";display:block;padding-top:56.25%}
.chip{margin-right:.6rem}
.thumb{margin-right:1rem}
.meta>*+*{margin-top:.15rem}
.dock>*{margin-right:.7rem}.dock>*:last-child{margin-right:0}
.tabs button{margin-right:.2rem}.tabs button:last-child{margin-right:0}
.tabs span{margin-top:.15rem}
#ov>*{margin:.45rem 0}
.bar>*{margin-right:.8rem}.bar>*:last-child{margin-right:0}
.act>*{margin-right:.4rem}.act>*:last-child{margin-right:0}
@media (max-width:900px){
 .app{display:block}
 .side{width:100%;height:100%}
 .side{border:0}
 .top h2{font-size:2rem}
 #grid{padding:0 2.4rem 8rem 0}
 .thumb{border-radius:0 .8rem .8rem 0}
 #scrub{bottom:8rem}
 .dock{display:flex}
 .pane{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:#000;padding:0;justify-content:flex-start}
 body.playing .pane{display:flex}
 #stage{max-width:none;flex:1;min-height:0;border-radius:0}
 #stage:before{display:none}
 .bar{width:100%;max-width:none;padding:.6rem .9rem .6rem;padding:.6rem .9rem calc(.6rem + env(safe-area-inset-bottom));background:var(--bg)}
 #back{display:flex}
 #fs,#quality{display:none}
}
@media (min-width:1600px){
 html{font-size:19px}
 .side{width:38rem}
}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="top"><h2>Chaînes</h2><select id="lang" aria-label="Langue" hidden></select></div>
  <div id="chips"></div>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><input id="q" type="search" placeholder="Rechercher" autocomplete="off"></label>
  <div class="listwrap"><div id="grid"></div><div id="scrub" hidden></div></div>
 </aside>
 <section class="pane">
  <div id="stage" data-s="idle">
   <video id="video" controls playsinline autoplay></video>
   <div id="ov"><div class="spin"></div><p id="msg"></p><button id="skip">Chaîne suivante</button></div>
  </div>
  <div class="bar">
   <button class="ib" id="back" aria-label="Retour à la liste"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
   <span class="blogo" id="blogo" hidden></span>
   <div class="info"><h1 id="title">Aucune chaîne</h1><small id="sub">Choisis une chaîne dans la liste</small></div>
   <div class="act">
    <select id="quality" aria-label="Qualité" hidden></select>
    <button class="ib" id="prev" aria-label="Chaîne précédente"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="ib" id="fav" aria-label="Ajouter aux favoris" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.9l6-.9z"/></svg></button>
    <button class="ib" id="next" aria-label="Chaîne suivante"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="ib" id="fs" aria-label="Plein écran"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
   </div>
  </div>
 </section>
</div>
<nav class="dock" aria-label="Navigation">
 <div class="tabs">
  <button data-go="all" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M8 2.5l4 3.5 4-3.5"/></svg><span>Chaînes</span></button>
  <button data-go="fav" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.7 5.5 6 .9-4.4 4.2 1 6-5.3-2.8-5.3 2.8 1-6L3.3 9.9l6-.9z"/></svg><span>Favoris</span></button>
 </div>
 <button class="srch" id="gosearch" aria-label="Rechercher"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg></button>
</nav>

 }
 const arr=[...m.values()].sort((a,b)=>a.name.localeCompare(b.name,"fr"));
 arr.forEach((c,i)=>{c.num=(i<9?"00":i<99?"0":"")+(i+1);c.q=c.qn?c.qn+"p":""});
 return arr;
}
async function load(lang){
 const key="ttv.pl."+lang.code;let txt=null;
 try{const r=await Promise.race([fetch(lang.url),new Promise((_,j)=>setTimeout(j,8000))]);if(!r.ok)throw 0;txt=await r.text();if(!txt.includes("#EXTINF"))throw 0;store.set(key,txt)}
 catch(e){txt=store.get(key,null)||lang.snapshot||null}
 if(!txt){$("#grid").innerHTML='<p class="empty">La liste n’a pas pu être chargée. Vérifie ta connexion et recharge la page.</p>';return}
 channels=merge(parseM3U(txt));cat="all";
 chips();render();
 const last=channels.find(c=>c.key===store.get("ttv.last"));
 if(last)select(last,false);
}

/* ---------- Interface ---------- */
function chips(){
 const n={};channels.forEach(c=>c.cats.forEach(g=>n[g]=(n[g]||0)+1));
 const cats=Object.keys(n).sort((a,b)=>n[b]-n[a]);
 $("#chips").innerHTML=[["all","Toutes les chaînes"],["fav","Favoris"],...cats.map(g=>[g,FR[g]||g])]
  .map(([k,l])=>`<button class="chip" data-k="${esc(k)}" aria-pressed="${k===cat}">${esc(l)}</button>`).join("");
}
const hue=k=>Math.abs([...k].reduce((a,ch)=>a*31+ch.charCodeAt(0)|0,7))%360;
// Si un logo ne charge pas en direct, on retente via le relais (si configuré), sinon les initiales restent.
function imgErr(i){if(PROXY&&!i.dataset.p){i.dataset.p=1;i.src=PROXY+encodeURIComponent(i.getAttribute("src"))}else i.remove()}
function row(c){
 const g=[...c.cats][0];
 return `<button class="row${favs.has(c.key)?" fav":""}" data-k="${esc(c.key)}" aria-current="${!!cur&&cur.key===c.key}"><span class="thumb" style="--h:${hue(c.key)}"><span class="plate">${esc(c.name.slice(0,2).toUpperCase())}${c.logo?`<img src="${esc(c.logo)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="imgErr(this)">`:""}</span></span><span class="meta"><span class="num">${c.num} - ${esc(FR[g]||g)}</span><span class="name">${esc(c.name)}</span><span class="q">${c.q||"En direct"}</span></span></button>`;
}
// Index vertical à droite de la liste : on le touche ou on le glisse pour parcourir vite.
function scrub(){
 const b=$("#scrub"),n=Math.min(24,visible.length);
 b.hidden=visible.length<10;
 if(b.hidden)return;
 b.innerHTML=`<small>${visible[0].num}</small>`+"<i></i>".repeat(n)+`<small>${visible[visible.length-1].num}</small>`;
 mark();
}
function mark(){
 const g=$("#grid"),d=$("#scrub").querySelectorAll("i");if(!d.length)return;
 const r=g.scrollHeight-g.clientHeight,k=Math.round((r>0?g.scrollTop/r:0)*(d.length-1));
 d.forEach((x,i)=>x.classList.toggle("on",i===k));
}
function drag(e){
 const b=$("#scrub").getBoundingClientRect(),g=$("#grid");
 g.scrollTop=Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))*(g.scrollHeight-g.clientHeight);
}
$("#grid").addEventListener("scroll",mark,{passive:true});
$("#scrub").addEventListener("pointerdown",e=>{e.currentTarget.setPointerCapture(e.pointerId);drag(e)});
$("#scrub").addEventListener("pointermove",e=>{if(e.buttons)drag(e)});
function render(){
 const q=$("#q").value.trim().toLowerCase();
 visible=channels.filter(c=>(cat==="all"||(cat==="fav"?favs.has(c.key):c.cats.has(cat)))&&(!q||c.name.toLowerCase().includes(q)));
 $("#grid").innerHTML=visible.length?visible.map(row).join("")
  :`<p class="empty">${cat==="fav"?"Tu n’as pas encore de favoris. Appuie sur l’étoile pendant une lecture.":"Aucune chaîne ne correspond."}</p>`;
 scrub();
}
function setStatus(s){
 stage.dataset.s=s;
 $("#msg").textContent=s==="error"?"Cette chaîne ne répond pas. Les flux gratuits tombent souvent ou refusent la lecture dans un navigateur. Essaie la suivante.":s==="idle"?"Choisis une chaîne dans la liste.":"";
}

/* ---------- Lecture ---------- */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsReq=el=>{const f=el.requestFullscreen||el.webkitRequestFullscreen;return f?f.call(el):null};
const fsExit=()=>{const f=document.exitFullscreen||document.webkitExitFullscreen;if(f)f.call(document)};
const safePlay=()=>{try{const p=video.play();p&&p.catch&&p.catch(()=>{})}catch(e){}};
const cands=()=>cur.urls.reduce((a,u)=>a.concat(PROXY?[u,PROXY+encodeURIComponent(u)]:[u]),[]);
const isMobile=()=>matchMedia("(max-width:900px)").matches;
function openPane(){
 if(!isMobile()||document.body.classList.contains("playing"))return;
 document.body.classList.add("playing");history.pushState({p:1},"");
 try{const f=fsReq(stage);f&&f.catch&&f.catch(()=>{})}catch(e){}
}
function closePane(){
 document.body.classList.remove("playing");
 if(fsEl())fsExit();
 stop();setStatus("idle");
}
function stop(){
 clearTimeout(timer);
 if(hls){hls.destroy();hls=null}
 video.onerror=null;video.removeAttribute("src");video.load();
 $("#quality").hidden=true;
}
function fail(){
 clearTimeout(timer);
 if(cur&&alt+1<cands().length){alt++;start();return}
 stop();setStatus("error");
}
function start(){
 stop();setStatus("loading");
 let u=cands()[alt];
 // Une page https bloque les flux http : on tente d’abord la version sécurisée.
 if(location.protocol==="https:"&&u.startsWith("http:"))u=u.replace("http:","https:");
 timer=setTimeout(fail,12000);
 const ua=navigator.userAgent;
 const tv=/Tizen|SMART-TV|SmartTV|Web0S|webOS|NetCast|HbbTV/i.test(ua);
 const native=video.canPlayType("application/vnd.apple.mpegurl")&&(tv||!/Chrome\/|Edg\/|Firefox\//.test(ua));
 if(native||!(window.Hls&&Hls.isSupported())){
  video.onerror=fail;video.src=u;safePlay();return;
 }
 let tries=0;
 hls=new Hls({enableWorker:true,startLevel:-1,capLevelToPlayerSize:false,maxBufferLength:40,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:2,fragLoadingMaxRetry:3});
 hls.on(Hls.Events.MANIFEST_PARSED,(_,d)=>{
  const q=$("#quality");
  q.innerHTML='<option value="-1">Auto</option>'+d.levels.map((l,i)=>`<option value="${i}">${l.height?l.height+"p":Math.round(l.bitrate/1000)+" kb/s"}</option>`).join("");
  q.hidden=d.levels.length<2;
  safePlay();
 });
 hls.on(Hls.Events.ERROR,(_,d)=>{
  if(!d.fatal)return;
  if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&tries++<1){hls.startLoad();return}
  if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&tries++<2){hls.recoverMediaError();return}
  fail();
 });
 hls.loadSource(u);hls.attachMedia(video);
}
function select(c,play=true){
 cur=c;alt=0;store.set("ttv.last",c.key);
 $("#title").textContent=c.name;
 const bl=$("#blogo");bl.innerHTML=c.logo?`<img src="${esc(c.logo)}" alt="" referrerpolicy="no-referrer" onerror="imgErr(this)">`:"";bl.hidden=!c.logo;
 $("#sub").textContent=[...c.cats].map(g=>FR[g]||g).join(", ");
 syncFav();
 document.querySelectorAll(".row").forEach(t=>t.setAttribute("aria-current",t.dataset.k===c.key));
 if(play){openPane();start()}
}
function step(d){
 if(!visible.length)return;
 const i=visible.findIndex(c=>cur&&c.key===cur.key);
 select(visible[(i+d+visible.length)%visible.length]);
}
function syncFav(){
 const on=!!cur&&favs.has(cur.key),b=$("#fav");
 b.setAttribute("aria-pressed",on);
 b.setAttribute("aria-label",on?"Retirer des favoris":"Ajouter aux favoris");
}
function fullscreen(){
 if(fsEl())fsExit();
 else if(stage.requestFullscreen||stage.webkitRequestFullscreen)fsReq(stage);
 else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen();
}

/* ---------- Événements ---------- */
video.addEventListener("playing",()=>{clearTimeout(timer);setStatus("ok")});
video.addEventListener("waiting",()=>{if(cur&&stage.dataset.s==="ok")setStatus("loading")});
$("#grid").addEventListener("click",e=>{
 const t=e.target.closest(".row");if(!t)return;
 select(channels.find(c=>c.key===t.dataset.k));
});
function setCat(k){
 cat=k;
 document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x.dataset.k===k));
 document.querySelectorAll(".dock [data-go]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.go===k));
 $("#grid").scrollTop=0;render();
}
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(b)setCat(b.dataset.k)});
$(".dock").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)setCat(b.dataset.go)});
$("#gosearch").onclick=()=>{$("#grid").scrollTop=0;$("#q").focus()};
$("#q").addEventListener("input",()=>{$("#grid").scrollTop=0;render()});
$("#prev").onclick=()=>step(-1);
$("#next").onclick=$("#skip").onclick=()=>step(1);
$("#fav").onclick=()=>{
 if(!cur)return;
 favs.has(cur.key)?favs.delete(cur.key):favs.add(cur.key);
 store.set("ttv.fav",[...favs]);syncFav();render();
};
$("#back").onclick=()=>history.state&&history.state.p?history.back():closePane();
addEventListener("popstate",()=>{if(document.body.classList.contains("playing"))closePane()});
$("#fs").onclick=fullscreen;
video.addEventListener("dblclick",fullscreen);
video.addEventListener("loadedmetadata",()=>{if(isMobile()&&!(stage.requestFullscreen||stage.webkitRequestFullscreen)&&video.webkitEnterFullscreen){try{video.webkitEnterFullscreen()}catch(e){}}});
$("#quality").onchange=e=>{if(hls)hls.currentLevel=+e.target.value};
addEventListener("keydown",e=>{
 if(e.target.matches("input,select"))return;
 const k=e.key.toLowerCase();
 if(k==="n"||k==="channelup"||e.keyCode===427)step(1);
 else if(k==="p"||k==="channeldown"||e.keyCode===428)step(-1);
 else if(k==="f")fullscreen();
 else if(k==="m")video.muted=!video.muted;
});

/* ---------- Démarrage ---------- */
const lang=$("#lang");
lang.innerHTML=LANGS.map(l=>`<option value="${l.code}">${esc(l.label)}</option>`).join("");
lang.hidden=LANGS.length<2;
lang.onchange=()=>{stop();cur=null;setStatus("idle");load(LANGS.find(l=>l.code===lang.value))};
setStatus("idle");
load(LANGS[0]);
</script>
</body>
</html>
